spring:
  application:
    name: similar-product-finder
  threads:
    virtual:
      enabled: true

similar-products:
  api:
    base-url: ${SIMILAR_PRODUCTS_API_BASE_URL:http://localhost:3001}
    connect-timeout: ${SIMILAR_PRODUCTS_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${SIMILAR_PRODUCTS_API_READ_TIMEOUT:7s}
  cache:
    enabled: ${SIMILAR_PRODUCTS_CACHE_ENABLED:true}
    ttl: ${SIMILAR_PRODUCTS_CACHE_TTL:5m}
    not-found-ttl: ${SIMILAR_PRODUCTS_CACHE_NOT_FOUND_TTL:1m}

resilience4j:
  circuitbreaker:
    instances:
      product-api:
        sliding-window-type: ${RESILIENCE4J_CIRCUITBREAKER_INSTANCES_PRODUCT_API_SLIDING_WINDOW_TYPE:COUNT_BASED}
        sliding-window-size: ${RESILIENCE4J_CIRCUITBREAKER_INSTANCES_PRODUCT_API_SLIDING_WINDOW_SIZE:20}
        minimum-number-of-calls: ${RESILIENCE4J_CIRCUITBREAKER_INSTANCES_PRODUCT_API_MINIMUM_NUMBER_OF_CALLS:10}
        failure-rate-threshold: ${RESILIENCE4J_CIRCUITBREAKER_INSTANCES_PRODUCT_API_FAILURE_RATE_THRESHOLD:50}
        slow-call-duration-threshold: ${RESILIENCE4J_CIRCUITBREAKER_INSTANCES_PRODUCT_API_SLOW_CALL_DURATION_THRESHOLD:2s}
        slow-call-rate-threshold: ${RESILIENCE4J_CIRCUITBREAKER_INSTANCES_PRODUCT_API_SLOW_CALL_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${RESILIENCE4J_CIRCUITBREAKER_INSTANCES_PRODUCT_API_WAIT_DURATION_IN_OPEN_STATE:10s}
        permitted-number-of-calls-in-half-open-state: ${RESILIENCE4J_CIRCUITBREAKER_INSTANCES_PRODUCT_API_PERMITTED_NUMBER_OF_CALLS_IN_HALF_OPEN_STATE:3}

server:
  port: ${SERVER_PORT:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
